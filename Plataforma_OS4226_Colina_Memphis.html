PARAMETROS.<\/t><\/si><si><t>CORES<\/t><\/si><si><t>Amarelo com letra azul = você digita.<\/t><\/si><si><t>Cinza = automático (fórmula). As abas estão protegidas sem senha para não apagar fórmula sem querer: Revisão &gt; Desproteger planilha, se precisar.<\/t><\/si><si><t>COMO FAZER UM ORÇAMENTO<\/t><\/si><si><t>1. Salve uma cópia deste modelo com o nome da obra (no Google Sheets: Arquivo &gt; Fazer uma cópia).<\/t><\/si><si><t>2. Aba ORCAMENTO: preencha cliente, obra e nº da proposta. Apague as linhas de exemplo.<\/t><\/si><si><t>3. Mão de obra: descreva a atividade, escolha o setor e informe nº de funcionários, dias e imprevisto. A diária vem da aba PARAMETROS.<\/t><\/si><si><t>4. Materiais: clique na célula da descrição e comece a digitar (ex.: 'metalon'); escolha o item. Un, preço, fornecedor e data da cotação aparecem sozinhos.<\/t><\/si><si><t xml:space=\"preserve\">   • Para usar outro preço só neste orçamento, digite em 'Preço adotado' (fica laranja). Em branco = preço do banco.<\/t><\/si><si><t xml:space=\"preserve\">   • Item que não está no banco: cadastre na aba INSUMOS (ou no banco compartilhado) e depois escolha na lista.<\/t><\/si><si><t xml:space=\"preserve\">   • Marque 'Sim' em 'Fat. direto?' nos itens que o cliente pode comprar direto do fornecedor.<\/t><\/si><si><t>5. Terceiros e despesas extras: locações, fretes, hospedagem, alimentação, serviços contratados.<\/t><\/si><si><t>6. Aba RESUMO: preço de venda, cenário com faturamento direto, preço por etapa (Estrutura / ACM / Letreiro) e programação de compras.<\/t><\/si><si><t>7. Aba MEMORIA: relatório de como cada valor foi calculado. Exporte em PDF junto com o RESUMO.<\/t><\/si><si><t>8. CONGELAR PREÇOS ao enviar a proposta: na aba ORCAMENTO, copie a coluna 'Preço banco' e cole como valores (Ctrl+Shift+V) em 'Preço adotado', e preencha 'Data-base preços'. Assim o orçamento enviado não muda quando alguém atualizar o banco.<\/t><\/si><si><t>AVISOS EM VERMELHO<\/t><\/si><si><t>• Preço usado zerado: item sem preço no banco. • Setor vazio em linha com custo: o valor não entra no preço por etapa (aparece em 'Sem setor' no RESUMO).<\/t><\/si><si><t>BANCO DE INSUMOS (aba INSUMOS)<\/t><\/si><si><t>• Uma linha por item, sem repetir descrição. Atualizou o preço? Atualize também a data e o 'Cotado por'.<\/t><\/si><si><t>• Vermelho = sem preço. Laranja na data = cotação com mais de 90 dias, vale confirmar.<\/t><\/si><si><t>• Não renomeie um item já usado em orçamentos antigos: o orçamento procura pela descrição exata. Se mudou o produto, crie uma linha nova.<\/t><\/si><si><t>BANCO COMPARTILHADO NO GOOGLE SHEETS (configuração única)<\/t><\/si><si><t>1. No Google Drive, envie o arquivo BANCO_INSUMOS_WR.xlsx e abra como Planilhas Google (Arquivo &gt; Salvar como Planilhas Google). Compartilhe com a equipe da WR como Editor.<\/t><\/si><si><t>2. Envie também este modelo e salve como Planilhas Google. Compartilhe como Editor.<\/t><\/si><si><t>3. No modelo, aba INSUMOS: apague tudo (clique no canto superior esquerdo e Delete) e, na célula A1, cole:<\/t><\/si><si><t xml:space=\"preserve\">      =IMPORTRANGE(\"COLE_AQUI_O_LINK_DO_BANCO\";\"INSUMOS!A1:K500\")<\/t><\/si><si><t>4. Clique em 'Permitir acesso'. Pronto: a lista e os preços vêm sempre do banco atualizado.<\/t><\/si><si><t>5. Cada orçamento novo = Arquivo &gt; Fazer uma cópia do modelo. Na cópia, pode pedir 'Permitir acesso' de novo.<\/t><\/si><si><t>6. Quem edita preços faz isso só no arquivo do banco. No Google Sheets, Arquivo &gt; Histórico de versões mostra quem alterou o quê.<\/t><\/si><si><t>PREMISSAS<\/t><\/si><si><t>• Preço de venda = custo ÷ (1 − Simples − comissões − lucro), como na R03. Os percentuais ficam na aba PARAMETROS.<\/t><\/si><si><t>• Custo indireto e itens sem setor são rateados entre Estrutura, ACM e Letreiro proporcionalmente ao custo direto.<\/t><\/si><si><t>• m² por chapa de ACM no banco considera chapa de 5,0 m de comprimento (conferir com o fornecedor).<\/t><\/si><si><t>PAINEL DO ORÇAMENTO – WR VISUAL / ART REVEST<\/t><\/si><si><t>Lista de seções (não apagar)<\/t><\/si><si><t>A. Custo por setor<\/t><\/si><si><t>B. Formação do preço (cenário 1)<\/t><\/si><si><t>CENÁRIO DE VENDA  ▸<\/t><\/si><si><t>1 - WR compra tudo<\/t><\/si><si><t>LUCRO (%)  ▸<\/t><\/si><si><t>C. Faturamento direto (cenário 2)<\/t><\/si><si><t>E. Compras e contratações<\/t><\/si><si><t>Custo da WR<\/t><\/si><si><t>Preço a cobrar (nota da WR)<\/t><\/si><si><t>Cliente compra direto<\/t><\/si><si><t>Desembolso total do cliente<\/t><\/si><si><t>Lucro real da WR<\/t><\/si><si><t>Lucro real (% da nota)<\/t><\/si><si><t>Economia do cliente (fat. direto)<\/t><\/si><si><t>F. Indicadores<\/t><\/si><si><t>VER SEÇÃO  ▸<\/t><\/si><si><t>Clique na seta para abrir outra seção (A, B, C, E ou F).<\/t><\/si><si><t>Os valores vêm da aba RESUMO; a conta passo a passo está na aba MEMORIA. Para mudar quantidades, preços ou itens, edite a aba ORCAMENTO.<\/t><\/si><si><t>PARÂMETROS DA WR VISUAL<\/t><\/si><si><t>A. DESPESAS MENSAIS (base da diária de mão de obra)<\/t><\/si><si><t>Despesa<\/t><\/si><si><t>Valor mensal (R$)<\/t><\/si><si><t>Observação<\/t><\/si><si><t>Salários da equipe de produção<\/t><\/si><si><t>Encargos e benefícios (INSS, FGTS, férias, 13º, VT, VA)<\/t><\/si><si><t>Pró-labore<\/t><\/si><si><t>Aluguel do barracão / escritório<\/t><\/si><si><t>Energia, água, internet e telefone<\/t><\/si><si><t>Veículos (combustível, manutenção, seguro, parcelas)<\/t><\/si><si><t>Contador, taxas e licenças<\/t><\/si><si><t>Ferramentas, equipamentos e manutenção<\/t><\/si><si><t>EPI e uniformes<\/t><\/si><si><t>Sistemas, softwares e outros fixos<\/t><\/si><si><t>Outros 1<\/t><\/si><si><t>Outros 2<\/t><\/si><si><t>TOTAL DAS DESPESAS MENSAIS<\/t><\/si><si><t>Funcionários de produção (quem vai para a obra/fábrica)<\/t><\/si><si><t>Quantidade que divide as despesas<\/t><\/si><si><t>Dias úteis por mês<\/t><\/si><si><t>Diária calculada (R$ por funcionário por dia)<\/t><\/si><si><t>Cálculo: Total das despesas ÷ (func e no orçamento com preço zero.<\/t><\/r><\/text><\/comment><comment ref=\"H1\" authorId=\"0\" shapeId=\"0\" xr:uid=\"{00000000-0006-0000-0300-000003000000}\"><text><r><rPr><sz val=\"11\"/><color theme=\"1\"/><rFont val=\"Calibri\"/><family val=\"2\"/><scheme val=\"minor\"/><\/rPr><t>Laranja = sem data ou cotação com mais de 90 dias.<\/t><\/r><\/text><\/comment><comment ref=\"J1\" authorId=\"0\" shapeId=\"0\" xr:uid=\"{00000000-0006-0000-0300-000004000000}\"><text><r><rPr><sz val=\"11\"/><color theme=\"1\"/><rFont val=\"Calibri\"/><family val=\"2\"/><scheme val=\"minor\"/><\/rPr><t>Área de uma chapa, usada só para calcular m² de ACM e R$/m².\r\nPreenchido supondo chapa de 5,0 m de comprimento (mesma premissa da R03: 1,50 x 5,0 = 7,5 m²). Conferir com o fornecedor.<\/t><\/r><\/text><\/comment><\/commentList><\/comments>"},"xl/comments2.xml":{"t":"<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\r\n<comments xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\" xmlns:mc=\"http://schemas.openxmlformats.org/markup-compatibility/2006\" mc:Ignorable=\"xr\" xmlns:xr=\"http://schemas.microsoft.com/office/spreadsheetml/2014/revision\"><authors><author>Claude<\/author><\/authors><commentList><comment ref=\"H4\" authorId=\"0\" shapeId=\"0\" xr:uid=\"{00000000-0006-0000-0400-000001000000}\"><text><r><rPr><sz val=\"11\"/><color theme=\"1\"/><rFont val=\"Calibri\"/><family val=\"2\"/><scheme val=\"minor\"/><\/rPr><t>Pode digitar a data por cima.<\/t><\/r><\/text><\/comment><comment ref=\"H6\" authorId=\"0\" shapeId=\"0\" xr:uid=\"{00000000-0006-0000-0400-000002000000}\"><text><r><rPr><sz val=\"11\"/><color theme=\"1\"/><rFont val=\"Calibri\"/><family val=\"2\"/><scheme val=\"minor\"/><\/rPr><t>Data em que os preços do banco foram conferidos/congelados.<\/t><\/r><\/text><\/comment><comment ref=\"F9\" authorId=\"0\" shapeId=\"0\" xr:uid=\"{00000000-0006-0000-0400-000003000000}\"><text><r><rPr><sz val=\"11\"/><color theme=\"1\"/><rFont val=\"Calibri\"/><family val=\"2\"/><scheme val=\"minor\"/><\/rPr><t>Vem da aba PARAMETROS (diária adotada). Para um valor diferente só nesta linha, digite por cima.<\/t><\/r><\/text><\/comment><comment ref=\"E28\" authorId=\"0\" shapeId=\"0\" xr:uid=\"{00000000-0006-0000-0400-000005000000}\"><text><r><rPr><sz val=\"11\"/><color theme=\"1\"/><rFont val=\"Calibri\"/><family val=\"2\"/><scheme val=\"minor\"/><\/rPr><t>Quantidade extra somada à Qtd (ex.: 1 chapa de sobra).<\/t><\/r><\/text><\/comment><comment ref=\"G28\" authorId=\"0\" shapeId=\"0\" xr:uid=\"{00000000-0006-0000-0400-000006000000}\"><text><r><rPr><sz val=\"11\"/><color theme=\"1\"/><rFont val=\"Calibri\"/><family val=\"2\"/><scheme val=\"minor\"/><\/rPr><t>Deixe em branco para usar o preço do banco.\r\nDigite um valor para usar outro preço só neste orçamento (fica laranja).\r\n\r\nCONGELAR PREÇOS ao enviar a proposta: copie a coluna 'Preço banco' e cole como VALORES nesta coluna (Ctrl+Shift+V).<\/t><\/r><\/text><\/comment><comment ref=\"J28\" authorId=\"0\" shapeId=\"0\" xr:uid=\"{00000000-0006-0000-0400-000007000000}\"><text><r><rPr><sz val=\"11\"/><color theme=\"1\"/><rFont val=\"Calibri\"/><family val=\"2\"/><scheme val=\"minor\"/><\/rPr><t>'Sim' = o cliente compra este item direto do fornecedor (faturamento direto). Veja o efeito no preço na aba RESUMO.<\/t><\/r><\/text><\/comment><comment ref=\"M28\" authorId=\"0\" shapeId=\"0\" xr:uid=\"{00000000-0006-0000-0400-000008000000}\"><text><r><rPr><sz val=\"11\"/><color theme=\"1\"/><rFont val=\"Calibri\"/><family val=\"2\"/><scheme val=\"minor\"/><\/rPr><t>Área das chapas de ACM (Qtd × m² por chapa do banco, sem a perda).<\/t><\/r><\/text><\/comment><comment ref=\"A29\" authorId=\"0\" shapeId=\"0\" xr:uid=\"{00000000-0006-0000-0400-000009000000}\"><text><r><rPr><sz val=\"11\"/><color theme=\"1\"/><rFont val=\"Calibri\"/><family val=\"2\"/><scheme val=\"minor\"/><\/rPr><t>Linha de exemplo: apague ou substitua.<\/t><\/r><\/text><\/comment><\/commentList><\/comments>"},"xl/comments3.xml":{"t":"<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\r\n<comments xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\" xmlns:mc=\"http://schemas.openxmlformats.org/markup-compatibility/2006\" mc:Ignorable=\"xr\" xmlns:xr=\"http://schemas.microsoft.com/office/spreadsheetml/2014/revision\"><authors><author>Claude<\/author><\/authors><commentList><comment ref=\"F4\" authorId=\"0\" shapeId=\"0\" xr:uid=\"{00000000-0006-0000-0100-000001000000}\"><text><r><rPr><sz val=\"11\"/><color theme=\"1\"/><rFont val=\"Calibri\"/><family val=\"2\"/><scheme val=\"minor\"/><\/rPr><t>Digite o lucro desejado (ex.: 20%). Em branco usa o valor da aba PARAMETROS.\r\nMuda o preço em todo o arquivo (RESUMO e MEMORIA também).<\/t><\/r><\/text><\/comment><\/commentList><\/comments>"},"xl/calcChain.xml":{"t":"<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\r\n<calcChain xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\"><c r=\"F49\" i=\"6\" l=\"1\"/><c r=\"F50\" i=\"6\"/><c r=\"B34\" i=\"6\"/><c r=\"I69\" i=\"5\"/><c r=\"G90\" i=\"5\" s=\"1\"/><c r=\"B34\" i=\"3\"/><c r=\"D37\" i=\"5\"/><c r=\"E37\" i=\"5\"/><c r=\"E36\" i=\"5\"/><c r=\"E35\" i=\"5\"/><c r=\"E34\" i=\"5\"/><c r=\"E33\" i=\"5\"/><c r=\"E32\" i=\"5\"/><c r=\"E31\" i=\"5\"/><c r=\"E30\" i=\"5\"/><c r=\"D36\" i=\"5\"/><c r=\"D35\" i=\"5\"/><c r=\"D34\" i=\"5\"/><c r=\"D33\" i=\"5\"/><c r=\"D32\" i=\"5\"/><c r=\"D31\" i=\"5\"/><c r=\"D30\" i=\"5\"/><c r=\"D29\" i=\"5\"/><c r=\"B20\" i=\"7\" l=\"1\"/><c r=\"D9\" i=\"7\"/><c r=\"C9\" i=\"7\"/><c r=\"C7\" i=\"7\"/><c r=\"C6\" i=\"7\"/><c r=\"A2\" i=\"7\"/><c r=\"G60\" i=\"6\"/><c r=\"E60\" i=\"6\"/><c r=\"C60\" i=\"6\"/><c r=\"A60\" i=\"6\"/><c r=\"A59\" i=\"6\"/><c r=\"E58\" i=\"6\"/><c r=\"A58\" i=\"6\"/><c r=\"A57\" i=\"6\"/><c r=\"G57\" i=\"6\" s=\"1\"/><c r=\"A50\" i=\"6\"/><c r=\"B37\" i=\"7\" s=\"1\"/><c r=\"B33\" i=\"6\"/><c r=\"B20\" i=\"6\"/><c r=\"D24\" i=\"7\" s=\"1\"/><c r=\"B17\" i=\"6\"/><c r=\"B16\ <script>/* Motor de fórmulas (subconjunto do Excel) – usado pela plataforma de orçamento.
   Avalia as fórmulas da própria planilha, então o resultado é o mesmo do Excel. */
(function (G) {
  'use strict';
  class XErr { constructor(c) { this.e = c; } toString() { return this.e; } }
  const ERR = c => new XErr(c);
  const isErr = v => v instanceof XErr;

  function colNum(s) { let n = 0; for (const ch of s.toUpperCase()) n = n * 26 + ch.charCodeAt(0) - 64; return n; }
  function colStr(n) { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - m - 1) / 26; } return s; }
  function parseAddr(a) { const m = /^\$?([A-Z]{1,3})\$?(\d+)$/.exec(a); return m ? { c: colNum(m[1]), r: +m[2] } : null; }
  function addr(r, c) { return colStr(c) + r; }

  // ---------------------------------------------------------------- tokenizer
  const SHEET = "(?:'(?:[^']|'')+'|[A-Za-z_\\u00C0-\\u017F][A-Za-z0-9_.\\u00C0-\\u017F]*)!";
  const CELL = '\\$?[A-Z]{1,3}\\$?\\d+';

  function renderResumo() {
    const S = 'RESUMO', sh = wb.sheets[S]; if (!sh) return '';
    const rows = []; for (let r = 1; r <= sh.maxRow; r++) rows.push(r);
    const secs = [];
    for (const r of rows) { const a = val(S, 'A' + r); if (typeof a === 'string' && /^[A-Z]\.\s/.test(a)) secs.push({ r, title: a }); }
    let chips = `<div class="chips">${secs.map((s, i) => `<button data-go="sec${i}">${esc(s.title.slice(0, 1))}. ${esc(s.title.replace(/^[A-Z]\.\s*/, '').replace(/\s*[–(].*$/, '').toLowerCase())}</button>`).join('')}</div>`;
    let h = `<section class="card"><h2>Resumo completo</h2>${chips}</section>`;
    secs.forEach((s, i) => {
      const end = (secs[i + 1] ? secs[i + 1].r : sh.maxRow + 1) - 1;
      const body = []; for (let r = s.r + 1; r <= end; r++) body.push(r);
      const cols = []; for (let c = 1; c <= Math.min(sh.maxCol, 8); c++) cols.push(XL.colStr(c));
      const isTable = body.length && cols.slice(1).filter(c => typeof val(S, c + body[0]) === 'string' && !wb.def(S, c + body[0])?.f && val(S, c + body[0])).length >= 2;
      let inner = '';
      if (isTable) {
        const hdr = body[0]; const used = cols.filter(c => val(S, c + hdr) !== null && val(S, c + hdr) !== '');
        inner = `<div class="tw"><table><thead><tr>${used.map(c => `<th>${esc(val(S, c + hdr))}</th>`).join('')}</tr></thead><tbody>`;
        for (const r of body.slice(1)) {
          const a = val(S, 'A' + r); if (a === null || a === '') continue;
          if (used.slice(1).every(c => wb.def(S, c + r) === undefined)) { inner += `</tbody></table></div><p class="note" data-cell="${S}!A${r}">${esc(fv(S, 'A' + r))}</p><div class="tw"><table><tbody>`; continue; }
          const bold = /^(TOTAL|CUSTO TOTAL)/i.test(String(a));
          inner += `<tr class="${bold ? 'b' : ''}">${used.map(c => `<td data-cell="${S}!${c}${r}">${esc(fv(S, c + r))}</td>`).join('')}</tr>`;
        }
        inner += '</tbody></table></div>';
      } else {
        inner = '<div class="kv">';
        for (const r of body) {
          const a = val(S, 'A' + r); if (a === null || a === '') continue;
          const hasB = wb.def(S, 'B' + r) !== undefined;
          if (!hasB) { inner += `<p class="note" data-cell="${S}!A${r}">${esc(fv(S, 'A' + r))}</p>`; continue; }
          const bold = String(a) === String(a).toUpperCase() && /[A-Z]/.test(String(a));
          inner += `<div class="row${bold ? ' b' : ''}"><span data-cell="${S}!A${r}">${esc(fv(S, 'A' + r))}<small>${esc(fv(S, 'C' + r))}</small></span><b data-cell="${S}!B${r}">${esc(fv(S, 'B' + r))}</b></div>`;
        }
        inner += '</div>';
      }
      h += `<section class="card sec" id="sec${i}"><details ${i < 3 ? 'open' : ''}><summary><h2>${esc(s.title)}</h2></summary>${inner}</details></section>`;
    });
    return h;
  }

  // ------------------------------------------------------------ atualização
  function refresh() {
    for (const el of $$('[data-cell]')) { const [sh, a] = splitKey(el.dataset.cell); el.textContent = fv(sh, a, el.dataset.k || undefined); }
    for (const el of $$('[data-in]')) {
      if (el === document.activeElement) continue;
      const [sh, a] = splitKey(el.dataset.in); const v = val(sh, a);
      el.value = el.dataset.text ? (v ?? '') : (typeof v === 'number' ? fmtIn(v, el.dataset.k) : (v ?? ''));
    }
    const sc = scenario();
    $$('[data-cen]').forEach((b, i) => b.classList.toggle('on', i + 1 === sc));
    const kc = kpiCols(); const priceCol = kc.find(c => /Pre[çc]o a cobrar/i.test(val('PAINEL', c + P.kpiLabels))) || kc[1];
    $('#sumPrice').textContent = fv('PAINEL', priceCol + P.kpiValues, 'c');
    $('#sumCost').textContent = L.custoTotal ? fv(O, L.custoTotal, 'c') : '';
    $('#sumSc').textContent = 'Cenário ' + sc;
    updateDirty();
  }
  function renderAll() { renderOrc(); renderPainel(); refresh(); }

  function commitInput(el) {
    const [sh, a] = splitKey(el.dataset.in); const k = el.dataset.k || ''; const raw = el.value.trim();
    const cur = wb.def(sh, a);
    let d;
    if (el.dataset.text) d = raw === '' ? null : { v: raw };
    else if (raw === '') d = null;
    else if (raw.startsWith('=')) {
      const f = '=' + ptToEn(raw.slice(1));
      try { XL.parse(f); } catch (e) { toast('Fórmula inválida: ' + e.message); refresh(); return; }
      d = { f };
    } else {
      if (k === 'd') { const m = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec(raw); if (!m) { toast('Use DD/MM/AAAA'); refresh(); return; } const y = +m[3] < 100 ? 2000 + +m[3] : +m[3]; d = { v: Math.round((Date.UTC(y, +m[2] - 1, +m[1]) - Date.UTC(1899, 11, 30)) / 864e5) }; }
      else { let n = parseNum(raw); if (isNaN(n)) { toast('Valor inválido'); refresh(); return; } if (k[0] === 'p') n = n / 100; d = { v: n }; }
    }
    // sem mudança real?
    if (cur && d && !d.f && !cur.f && cur.v === d.v) return;
    if (cur && d && d.f && cur.f === d.f) return;
    if (!cur && !d) return;
    if (cur && cur.f && d && !d.f && typeof val(sh, a) === 'number' && Math.abs(val(sh, a) - d.v) < 1e-9) return;
    setCell(sh, a, d);
    if (sh === O && a === L.header.rev && prop) { prop.rev = d ? String(d.v) : ''; save(); $('#ttl').textContent = (val(O, L.header.prop) || 'Orçamento') + (prop.rev ? ' · ' + prop.rev : ''); for (const x of $$(`[data-in="${O}!${a}"]`)) if (x !== el) x.value = prop.rev; }
    const lbl = el.closest('.fld'); if (lbl) lbl.classList.add('chg');
    const needsRender = (wb.base(sh, a) && wb.base(sh, a).f) || (cur && cur.f) || (d && d.f);
    if (el.closest('#modal')) { if (needsRender && modalRender) modalRender(); renderOrc(); }
    else if (needsRender) renderPainel();
    refresh();
  }

  function closeModal() { const m = $('#modal'); const wasEdit = !!modalRender || m.querySelector('.edt'); m.hidden = true; m.innerHTML = ''; document.body.classList.remove('lock'); modalRender = null; if (wasEdit) { renderOrc(); renderPainel(); refresh(); } }

  function openPicker(row) {
    const list = insumos();
    openModal(`<div class="mh"><h3>${row ? 'Trocar insumo' : 'Incluir insumo'}</h3><button class="x" data-close>✕</button></div>
      <input id="q" type="search" placeholder="Buscar no banco (ex.: metalon, chapa, silicone)" autocomplete="off">
      <div id="res" class="res"></div>
      <details class="newi"><summary>Item fora do banco</summary><div class="grid g2">

        <label class="fld"><span>Un</span><input id="nUn" value="un"></label>

      const q = $('#q', m), res = $('#res', m);
      const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
      const draw = () => {
        const t = norm(q.value).split(/\s+/).filter(Boolean);
        const items = list.filter(it => t.every(w => norm(it.desc + ' ' + it.cat + ' ' + it.forn).includes(w))).slice(0, 80);
        res.innerHTML = items.map(it => `<button class="ri" data-desc="${esc(it.desc)}"><span>${esc(it.desc)}<small>${esc(it.cat)} · ${esc(it.forn)}</small></span><b>${typeof it.preco === 'number' ? brl(it.preco) + '/' + esc(it.un) : '<em class="warn">sem preço</em>'}</b></button>`).join('') || '<p class="hint">Nada encontrado.</p>';
      };

      res.onclick = e => { const b = e.target.closest('[data-desc]'); if (b) choose(b.dataset.desc); };

        pushHist(); addInsumo({ desc, un: $('#nUn', m).value.trim(), preco: parseNum($('#nPreco', m).value) || 0, forn: $('#nForn', m).value.trim() });
        choose(desc, true);
      };
    });
    function choose(desc, noHist) {
      closeModal();
      if (row) { setCell(O, L.mat.cols.desc + row, { v: desc }, { noHist }); renderOrc(); refresh(); openItemEditor('mat', row); }
      else { const r = addRow('mat', { desc, setor: defaultSetor('mat'), qtd: 1, perda: 0, fd: 'Não' }); if (r) openItemEditor('mat', r); }
    }
  }

  // ------------------------------------------------------------ proposta: dados e edição
  function initialProp() {
    const p = D.prop; if (!p) return null;
    const services = []; const obs = []; const kv = []; let cur = null, inServ = false, inObs = false, sec = '';
    for (const b of p.blocks) {
      if (b.type === 'h1') { sec = b.text.toLowerCase(); inServ = /servi/.test(sec); inObs = false; cur = null; continue; }
      if (b.type === 'h2' && inServ) { cur = { title: b.text, bullets: [] }; services.push(cur); continue; }
      if (b.type === 'bullet' && inServ) { if (!cur) { cur = { title: '', bullets: [] }; services.push(cur); } cur.bullets.push(b.runs.map(r => r.t).join('')); continue; }
      if (b.type === 'kv') { kv.push({ label: b.label, value: b.value }); continue; }
      if (b.type === 'obsTitle') { inObs = true; continue; }
      if (b.type === 'bullet' && inObs) { obs.push(b.runs.map(r => r.t).join('')); continue; }
      if (b.type !== 'bullet') inObs = false;
    }
    const d = new Date();
    return { numero: p.meta.numero, rev: p.meta.rev, city: p.meta.city, date: d.toISOString().slice(0, 10),
      header: p.header.map(h => ({ ...h })), services, kv, obs, signLabel: (p.meta.signLabel || '').trim(), cen2Mode: 'nota' };
  }
  function openPropEditor() {
    if (!prop) return toast('Nenhuma proposta embutida neste arquivo.');
    const p = prop;
    const svc = p.services.map((s, i) => `<label class="fld s2"><span>Serviço ${i + 1} – título</span><input data-p="svcT:${i}" value="${esc(s.title)}"></label>
      <label class="fld s2"><span>Tópicos (um por linha)</span><textarea rows="${Math.max(4, s.bullets.length + 1)}" data-p="svcB:${i}">${esc(s.bullets.join('\n'))}</textarea></label>
      <div class="fld s2 imgs"><span>Imagens do serviço ${i + 1} (saem no PDF, logo abaixo dos tópicos)</span>
        ${(s.imgs || []).map((im, j) => `<div class="imgit"><img src="${im.src}" alt=""><div class="imgc"><input data-p="imgCap:${i}:${j}" value="${esc(im.cap || '')}" placeholder="Legenda (opcional)"><button class="lnk" data-imgdel="${i}:${j}">Remover imagem</button></div></div>`).join('')}
        <label class="btn ghost upl">📷 Adicionar imagem<input type="file" accept="image/*" data-imgadd="${i}" hidden></label></div>`).join('');
    openModal(`<div class="mh"><h3>Textos da proposta</h3><button class="x" data-close>✕</button></div><div class="grid g2 pform">
      <label class="fld"><span>Nº do orçamento</span><input data-p="numero" value="${esc(p.numero)}"></label>
      <label class="fld"><span>Revisão</span><input data-p="rev" value="${esc(p.rev)}"></label>
      <label class="fld"><span>Cidade</span><input data-p="city" value="${esc(p.city)}"></label>
      <label class="fld"><span>Data</span><input type="date" data-p="date" value="${esc(p.date)}"></label>
      ${p.header.map((h, i) => `<label class="fld s2"><span>${esc(h.label)}</span><input data-p="hdr:${i}" value="${esc(h.value)}"></label>`).join('')}
      ${svc}
      ${p.kv.map((h, i) => `<label class="fld s2"><span>${esc(h.label)}</span><input data-p="kv:${i}" value="${esc(h.value)}"></label>`).join('')}
      <label class="fld s2"><span>Observações (uma por linha)</span><textarea rows="4" data-p="obs">${esc(p.obs.join('\n'))}</textarea></label>
      <label class="fld s2"><span>No cenário 2, o valor da proposta mostra</span><select data-p="cen2Mode">
        <option value="nota"${p.cen2Mode === 'nota' ? ' selected' : ''}>Nota da WR + materiais comprados direto pelo cliente (separados)</option>
        <option value="total"${p.cen2Mode === 'total' ? ' selected' : ''}>Só o desembolso total do cliente</option></select></label>
      </div><button class="btn pri" data-close>Concluir</button>`, m => {
      m.addEventListener('click', e => { const d = e.target.closest('[data-imgdel]'); if (!d) return; const [i, j] = d.dataset.imgdel.split(':').map(Number); p.services[i].imgs.splice(j, 1); save(); openPropEditor(); });
      m.addEventListener('change', async e => {
        const t = e.target;
        if (t.dataset.imgadd !== undefined) { const f = t.files && t.files[0]; if (!f) return; try { const im = await loadImage(f); const sv = p.services[+t.dataset.imgadd]; (sv.imgs = sv.imgs || []).push(im); save(); openPropEditor(); } catch (err) { toast('Não consegui ler a imagem'); } return; }
        const k = t.dataset.p; if (!k) return; const v = t.value;
        const [a, i] = k.split(':');
        if (a === 'hdr') p.header[+i].value = v; else if (a === 'kv') p.kv[+i].value = v;
        else if (a === 'svcT') p.services[+i].title = v; else if (a === 'svcB') p.services[+i].bullets = v.split('\n').map(s => s.trim()).filter(Boolean);
        else if (a === 'obs') p.obs = v.split('\n').map(s => s.trim()).filter(Boolean);
        else if (a === 'imgCap') { const [si, ji] = i.split(':'), jj = k.split(':')[2]; p.services[+i].imgs[+jj].cap = v; }
        else p[a] = v;
        if (a === 'rev' && L.header.rev) { wb.set(O, L.header.rev, v ? { v } : null); renderOrc(); renderPainel(); refresh(); }
        save();
      });
    });
  }

  function loadImage(file) { // reduz para no máx. 1400 px e converte para JPEG (cabe no PDF e no aparelho)
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file); const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight)); const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
        const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url); res({ src: c.toDataURL('image/jpeg', 0.82), w, h, cap: '' });
      };
      img.onerror = rej; img.src = url;

      }
      const dim = doc.getElementsByTagNameNS(NS, 'dimension')[0];
      if (dim && S.maxRow) dim.setAttribute('ref', 'A1:' + XL.colStr(Math.max(S.maxCol, 1)) + S.maxRow);
      out[path] = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + new XMLSerializer().serializeToString(doc).replace(/^<\?xml[^>]*\?>\s*/, '');
    }
    // calcChain fora; recalcular ao abrir
    delete parts['xl/calcChain.xml'];
    out['xl/_rels/workbook.xml.rels'] = rels.replace(/<Relationship [^>]*calcChain[^>]*\/>/, '');
    out['[Content_Types].xml'] = parts['[Content_Types].xml'].t.replace(/<Override [^>]*calcChain[^>]*\/>/, '');
    out['xl/workbook.xml'] = /<calcPr[^>]*fullCalcOnLoad/.test(wbXml) ? wbXml : wbXml.replace(/<calcPr([^>]*?)\/>/, '<calcPr$1 fullCalcOnLoad="1"/>');
    const te = new TextEncoder(); const files = [];
    const order = Object.keys(parts).sort((a, b) => (a === '[Content_Types].xml' ? -1 : b === '[Content_Types].xml' ? 1 : 0));
    for (const k of order) {
      if (k in out) files.push({ name: k, data: te.encode(out[k]) });
      else if (parts[k].t !== undefined) files.push({ name: k, data: te.encode(parts[k].t) });
      else files.push({ name: k, data: b64(parts[k].b) });
    }
    return zip(files);
  }

  // ------------------------------------------------------------ download / compartilhar
  async function deliver(blob, name, mime) {
    const file = new File([blob], name, { type: mime });
    const url = URL.createObjectURL(blob);
    openModal(`<div class="mh"><h3>Arquivo pronto</h3><button class="x" data-close>✕</button></div><p class="fname">${esc(name)}</p>
      <div class="acts"><a class="btn pri" href="${url}" download="${esc(name)}">⬇︎ Baixar</a>
      ${navigator.canShare && navigator.canShare({ files: [file] }) ? '<button class="btn" id="shr">↗︎ Compartilhar (WhatsApp, e-mail…)</button>' : ''}
      ${mime === 'application/pdf' ? `<a class="btn ghost" href="${url}" target="_blank" rel="noopener">👁 Abrir</a>` : ''}</div>`, m => {
      const s = $('#shr', m); if (s) s.onclick = async () => { try { await navigator.share({ files: [file], title: name }); } catch (e) { } };
    });
  }
  function safeName(s) { return String(s).replace(/[\\/:*?"<>|]+/g, '-').trim(); }
  function xlsxName() { const rev = val(O, L.header.rev) || ''; let n = D.meta.xlsxName.replace(/\.xlsx$/i, ''); n = n.replace(/_R\d{2}$/i, ''); return safeName(n + (rev ? '_' + rev : '') + '_web.xlsx'); }
  function pdfName() { const base = (D.prop.source || 'Proposta').replace(/\.docx$/i, ''); return safeName(base.replace(/\s+R\d{2}$/i, '') + ' ' + prop.rev + '.pdf'); }

  // ------------------------------------------------------------ eventos
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2600); }
  function bind() {
    document.addEventListener('change', e => {
      const t = e.target;
      if (t.dataset.in) commitInput(t);
      else if (t.dataset.sel) { const [sh, a] = splitKey(t.dataset.sel); setCell(sh, a, t.value === '' ? null : { v: t.value }); refresh(); }
    });
    document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.in) e.target.blur(); });
    document.addEventListener('focusin', e => { const t = e.target; if (t.dataset && t.dataset.in && !t.dataset.text) setTimeout(() => t.select && t.select(), 0); });
    document.addEventListener('click', e => {
      const b = e.target.closest('button, a');
      if (!b) { const tr = e.target.closest('tr[data-edit]'); if (tr) { const [blk, r] = tr.dataset.edit.split(':'); openItemEditor(blk, +r); } return; }
      if (b.dataset.tab) { switchTab(b.dataset.tab); return; }
      if (b.dataset.tog) { const [sh, a] = splitKey(b.dataset.tog); const on = String(val(sh, a)).toLowerCase() === 'sim'; setCell(sh, a, { v: on ? 'Não' : 'Sim' }); b.classList.toggle('on', !on); b.lastChild.textContent = on ? 'Não' : 'Sim'; refresh(); return; }
      if (b.dataset.del) { const [blk, r] = b.dataset.del.split(':'); const nm = val(O, BLK[blk].cols.desc + r) || 'item'; if (confirm('Excluir "' + String(nm).trim() + '"?')) { if (!$('#modal').hidden) closeModal(); removeRow(blk, +r); } return; }
      if (b.dataset.edithdr) { openHeaderEditor(); return; }
      if (b.dataset.add) { const blk = b.dataset.add; if (blk === 'mat') openPicker(null); else { const r = addRow(blk, blk === 'mo' ? { desc: 'Nova atividade', setor: defaultSetor('mo'), func: 1, dias: 1, imp: 0 } : { desc: 'Novo serviço / despesa', setor: defaultSetor('ter'), un: 'vb', qtd: 1, imp: 0, preco: 0, fd: 'Não' }); if (r) openItemEditor(blk, r); } return; }
      if (b.dataset.pick) { openPicker(+b.dataset.pick); return; }
      if (b.dataset.restore) { const [sh, a] = splitKey(b.dataset.restore); pushHist(); delete wb.over[wb.key(sh, a)]; wb.memo.clear(); save(); renderAll(); return; }
      if (b.dataset.cen) { setCell('PAINEL', P.cen, { v: b.dataset.cen }); refresh(); renderPainel(); refresh(); return; }
      if (b.dataset.go) { const el = document.getElementById(b.dataset.go); if (el) { const d = el.querySelector('details'); if (d) d.open = true; el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } return; }
      switch (b.id) {
        case 'bUndo': undo(); break;
        case 'bPdf': try { if (!prop) return toast('Nenhuma proposta embutida.'); const r = buildProposalPdf(); deliver(new Blob([r.bytes], { type: 'application/pdf' }), pdfName(), 'application/pdf'); } catch (err) { console.error(err); alert('Erro ao gerar PDF: ' + err.message); } break;
        case 'bXlsx': try { deliver(buildXlsx(), xlsxName(), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'); } catch (err) { console.error(err); alert('Erro ao gerar Excel: ' + err.message); } break;
        case 'bProp': openPropEditor(); break;
        case 'bReset': if (confirm('Descartar todas as alterações e voltar ao orçamento original?')) { pushHist(); wb.reset(); prop = initialProp(); insumoRowsAdded = 0; for (const s of D.wb.sheets) { wb.sheets[s.name].maxRow = s.maxRow; wb.sheets[s.name].maxCol = s.maxCol; } save(); renderAll(); toast('Orçamento original restaurado'); } break;
      }
    });
  }
  function switchTab(t) {
    $$('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
    $('#orc').hidden = t !== 'orc'; $('#painel').hidden = t !== 'painel'; window.scrollTo(0, 0);
  }

  // ------------------------------------------------------------ início
  function start() {
    load();
    const H = L.header;
    if (D.logo) { const lg = $('#logo'); lg.src = D.logo; lg.hidden = false; }
    $('#ttl').textContent = (val(O, H.prop) || 'Orçamento') + (val(O, H.rev) ? ' · ' + val(O, H.rev) : '');
    $('#sub').textContent = val(O, H.obra) || '';
    document.title = $('#ttl').textContent + ' – Orçamento';
    renderAll(); bind(); switchTab('painel');
    if (wb.problems.length) console.warn('Fórmulas não suportadas (usando valor original):', wb.problems);
    window.__app = { wb, buildXlsx, buildProposalPdf, extenso, removeRow, addRow, setCell, val, scenario, insumos, addInsumo, get prop() { return prop; } };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
